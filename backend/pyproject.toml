[project]
name = "quookly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "fastapi[all]>=0.136.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
]
[dependency-groups]
dev = [
    "import-linter>=2.13",
    "mypy>=2.1.0",
    "pytest >=9.0.3",
    "pytest-asyncio >=1.3.0",
    "pytest-cov >=7.1.0",
    "ruff>=0.15.15",
]
[project.scripts]
quookly = "quookly.api:main"
export_openapi = "quookly.api:export_openapi"

[build-system]
requires = ["uv_build>=0.11.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/quookly/app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_package = "quookly"
# Needed so contracts can name third-party packages, which is how the ORM is kept
# inside the access layer.
include_external_packages = true

# The iDesign call rules, enforced (ADR-008, NFR-10). Calls flow strictly downward.
# Contracts covering individual services are added alongside those services — a contract
# naming a module that does not exist is an error, not a no-op.
[[tool.importlinter.contracts]]
name = "Calls flow downward through the layers"
type = "layers"
containers = ["quookly"]
layers = ["routes", "managers", "engines", "access"]
exhaustive = true
exhaustive_ignores = ["api", "utilities", "contracts"]

[[tool.importlinter.contracts]]
name = "Utilities do not depend on the layers that use them"
type = "forbidden"
source_modules = ["quookly.utilities"]
forbidden_modules = [
    "quookly.routes",
    "quookly.managers",
    "quookly.engines",
    "quookly.access",
]

[[tool.importlinter.contracts]]
name = "Contracts depend on nothing else in the package"
type = "forbidden"
source_modules = ["quookly.contracts"]
forbidden_modules = [
    "quookly.routes",
    "quookly.managers",
    "quookly.engines",
    "quookly.access",
    "quookly.utilities",
]

# ADR-018: SQLModel makes the datastore swappable, the access layer makes it possible.
# If business logic imported ORM types, the datastore would be part of the domain.
[[tool.importlinter.contracts]]
name = "The ORM does not escape the access layer"
type = "forbidden"
source_modules = [
    "quookly.routes",
    "quookly.managers",
    "quookly.engines",
    "quookly.contracts",
    "quookly.utilities",
]
forbidden_modules = ["sqlmodel", "sqlalchemy"]
# Only direct imports. A manager calling a resource access service that itself uses the
# ORM is the layering working as designed; what is forbidden is business logic naming an
# ORM type itself.
allow_indirect_imports = true
