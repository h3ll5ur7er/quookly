[project]
name = "quookly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.136.1",
]
[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest >=9.0.3",
    "pytest-asyncio >=1.3.0",
    "pytest-cov >=7.1.0",
    "ruff>=0.15.15",
]
[project.scripts]
quookly = "quookly.api:main"
export_openapi = "quookly.api:export_openapi"

[build-system]
requires = ["uv_build>=0.11.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/quookly/app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
