[project]
name = "quookly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "fastapi[all]>=0.136.1",
    "httpx>=0.28.1",
    "lxml>=6.1.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
    "trafilatura>=2.2.0",
]
[dependency-groups]
dev = [
    "import-linter>=2.13",
    "lxml-stubs>=0.5.1",
    "mypy>=2.1.0",
    "pytest >=9.0.3",
    "pytest-asyncio >=1.3.0",
    "pytest-cov >=7.1.0",
    "ruff>=0.15.15",
]
[project.scripts]
quookly = "quookly.api:main"
export_openapi = "quookly.api:export_openapi"

[build-system]
requires = ["uv_build>=0.11.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/quookly/app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameter metadata by calling these in argument defaults. It is the
# framework's documented idiom, not the mutable-default trap B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Tests that need a real inference provider. Excluded by default: a suite that needs
# a running model is a suite nobody runs. Enable with `-m live`.
markers = ["live: needs a real inference provider"]
addopts = "-m 'not live'"

[tool.importlinter]
root_package = "quookly"
# Needed so contracts can name third-party packages, which is how the ORM is kept
# inside the access layer.
include_external_packages = true

# The iDesign call rules, enforced (ADR-008, NFR-10). Calls flow strictly downward.
# Contracts covering individual services are added alongside those services — a contract
# naming a module that does not exist is an error, not a no-op.
[[tool.importlinter.contracts]]
name = "Calls flow downward through the layers"
type = "layers"
containers = ["quookly"]
layers = ["routes", "managers", "engines", "access"]
exhaustive = true
exhaustive_ignores = ["api", "utilities", "contracts"]

[[tool.importlinter.contracts]]
name = "Utilities do not depend on the layers that use them"
type = "forbidden"
source_modules = ["quookly.utilities"]
forbidden_modules = [
    "quookly.routes",
    "quookly.managers",
    "quookly.engines",
    "quookly.access",
]

[[tool.importlinter.contracts]]
name = "Contracts depend on nothing else in the package"
type = "forbidden"
source_modules = ["quookly.contracts"]
forbidden_modules = [
    "quookly.routes",
    "quookly.managers",
    "quookly.engines",
    "quookly.access",
    "quookly.utilities",
]

# ADR-018: SQLModel makes the datastore swappable, the access layer makes it possible.
# If business logic imported ORM types, the datastore would be part of the domain.
[[tool.importlinter.contracts]]
name = "The ORM does not escape the access layer"
type = "forbidden"
source_modules = [
    "quookly.routes",
    "quookly.managers",
    "quookly.engines",
    "quookly.contracts",
    "quookly.utilities",
]
forbidden_modules = ["sqlmodel", "sqlalchemy"]
# Only direct imports. A manager calling a resource access service that itself uses the
# ORM is the layering working as designed; what is forbidden is business logic naming an
# ORM type itself.
allow_indirect_imports = true

# A client holds no business logic and owns no use case, so it has nothing to say to a
# resource access service. The layers contract above allows skipping a layer, which is
# why this needs stating separately -- and it is the rule most easily broken by a route
# that only needs "one quick lookup".
[[tool.importlinter.contracts]]
name = "Clients do not reach resource access"
type = "forbidden"
source_modules = ["quookly.routes"]
forbidden_modules = ["quookly.access"]
# Only direct imports: a route calling a manager that reads the database is the layering
# working as designed.
allow_indirect_imports = true

# ADR-006 and ADR-008: rule engines are pure functions, so their inputs arrive as
# arguments and they can be tested as a table of cases.
#
# This contract used to name `quookly.engines` wholesale, with a note that the first
# capability engine would break the build until it was rewritten. `InterpretationEngine`
# is that engine, and it did.
#
# The rule engines are now listed one by one. That is the point: adding an engine does not
# quietly grant it I/O, and adding I/O to one of these still breaks the build. A new
# capability engine — one mediating the search index, say — is added by *leaving it out*
# of this list, which is a line in a review rather than a silence.
[[tool.importlinter.contracts]]
name = "Rule engines do not reach resource access"
type = "forbidden"
source_modules = [
    "quookly.engines.exchange",
    "quookly.engines.measure",
    "quookly.engines.onboarding",
    "quookly.engines.suitability",
]
forbidden_modules = ["quookly.access"]
