<main class="auth">
  <img
    class="auth__mark"
    ngSrc="icons/icon-192.png"
    width="192"
    height="192"
    alt="Quookly"
    priority
  />
  <h1 i18n="@@bootstrapHeading">Welcome to Quookly</h1>
  <p class="auth__lede" i18n="@@bootstrapLede">
    This instance has no accounts yet. Create the first one to become its administrator.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="display_name" i18n="@@fieldDisplayName">Your name</label>
    <input
      id="display_name"
      type="text"
      formControlName="display_name"
      autocomplete="name"
      required
    />

    <label for="email" i18n="@@fieldEmail">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" required />

    <label for="password" i18n="@@fieldPassword">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="new-password"
      [attr.minlength]="minimumPasswordLength"
      aria-describedby="password-hint"
      required
    />
    <p id="password-hint" class="hint" i18n="@@passwordHint">
      At least {{ minimumPasswordLength }} characters.
    </p>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button type="submit" [disabled]="form.invalid || submitting()">
      @if (submitting()) {
        <span i18n="@@bootstrapSubmitting">Creating…</span>
      } @else {
        <span i18n="@@bootstrapSubmit">Create administrator</span>
      }
    </button>
  </form>
</main>
