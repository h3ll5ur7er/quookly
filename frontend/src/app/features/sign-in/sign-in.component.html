<main class="auth">
  <h1 i18n="@@signInHeading">Sign in to Quookly</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="email" i18n="@@fieldEmail">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" required />

    <label for="password" i18n="@@fieldPassword">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      required
    />

    @if (failed()) {
      <p class="error" role="alert" i18n="@@signInFailed">Those credentials did not match an account.</p>
    }

    <button type="submit" [disabled]="form.invalid || submitting()">
      @if (submitting()) {
        <span i18n="@@signInSubmitting">Signing in…</span>
      } @else {
        <span i18n="@@signInSubmit">Sign in</span>
      }
    </button>
  </form>
</main>
