<a class="skip" href="#content" i18n="@@skipToContent">Skip to content</a>

@if (chromed() && signedIn()) {
  <div class="shell">
    <!-- The brand, the person, and the way out. On a phone this is one slim row at the
         top; from `lg` it becomes the head of the sidebar, which is where a persistent
         navigation puts it. -->
    <header class="shell__top">
      <a class="shell__brand" routerLink="/">
        <img class="shell__mark" src="/icons/icon-192.png" alt="" width="32" height="32" />
        <span class="shell__name">Quookly</span>
      </a>

      <nav class="shell__nav" aria-label="Sections" i18n-aria-label="@@navLabel">
        @for (section of sections; track section.path) {
          <a
            class="shell__link"
            [class.shell__link--wide]="section.wide"
            [routerLink]="section.path"
            routerLinkActive="shell__link--current"
            [routerLinkActiveOptions]="{ exact: section.path === '/' }"
            ariaCurrentWhenActive="page"
          >
            <app-nav-icon class="shell__icon" [name]="section.name" />
            <span class="shell__label">{{ sectionLabel(section.name) }}</span>
          </a>
        }
      </nav>

      <a
        class="shell__account"
        routerLink="/settings"
        routerLinkActive="shell__account--current"
        i18n-aria-label="@@navSettings"
        aria-label="Settings and account"
      >
        <span class="shell__avatar" aria-hidden="true">{{ initial() }}</span>
        <span class="shell__who">{{ name() }}</span>
      </a>
    </header>

    <div id="content" class="shell__content">
      <router-outlet />
    </div>
  </div>
} @else {
  <!-- Signed out, or a screen that wants none of the furniture. -->
  <div class="shell shell--bare">
    <div id="content" class="shell__content">
      <router-outlet />
    </div>

    <!-- The two choices somebody makes *before* they have an account to keep them in. Once
         signed in they live in Settings, where everything set-once-and-left-alone lives —
         but a visitor who reads French should not have to sign in to say so. -->
    @if (chromed()) {
      <footer class="shell__aside">
        <app-locale-picker />
        <app-theme-picker />
      </footer>
    }
  </div>
}
