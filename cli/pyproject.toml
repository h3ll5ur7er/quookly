[project]
name = "quookly-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dependency-injector>=4.49.0",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "openapi-python-client>=0.28.4",
    "pydantic-settings>=2.14.1",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest >=9.0.3",
    "pytest-asyncio >=1.3.0",
    "pytest-cov >=7.1.0",
    "ruff>=0.15.13",
]
[project.scripts]
quookly-cli = "quookly_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/quookly_cli/api_client"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = "quookly_cli.api_client.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
