# Publish the image to the GitHub Container Registry.
#
# One artefact serving the API and the frontend (NFR-2). Built for two architectures
# because a self-hoster's box is as likely to be a Raspberry Pi or an Apple laptop as an
# x86 server.

name: image

on:
  push:
    branches: [master]
    tags: ['v*']
  # For publishing a build without pushing anything.
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by Actions. No secret to create, which is one less step between
          # forking this and having an image of your own.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shared across runs, so a change to the application does not rebuild the world.
          cache-from: type=gha
          cache-to: type=gha,mode=max
