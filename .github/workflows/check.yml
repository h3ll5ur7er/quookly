# The gate, on every push and pull request.
#
# The same `just check` a developer runs, rather than a second definition of "green" that
# drifts from the one on their machine.

name: check

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  # A newer push makes an older run pointless. Cancels the old one rather than queueing it.
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          # The version the frontend pins. Read from the file rather than repeated here,
          # so this cannot drift from what a developer runs.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          # Only for openapi-generator-cli, which generates the frontend's client.
          distribution: temurin
          java-version: '21'

      - name: Install
        run: just install

      - name: Generate the clients
        # Both are gitignored and generated from the schema. Without this the frontend does
        # not compile and the CLI cannot reach the API — which is exactly what a fresh
        # clone does, so it is worth running the same way here.
        run: just openapi

      - name: Check
        run: just check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: just install

      - name: Generate the clients
        run: just openapi

      - name: Build the frontend
        # The suite runs against the built bundle the backend serves, not a dev server. A
        # stale bundle is a whole class of false failure.
        run: just frontend build

      - name: Install the browser
        # The full Chromium, not the headless shell — the shell segfaults, and the crash
        # surfaces one test later as "browser has been closed".
        run: just frontend _nvm "npx playwright install --with-deps chromium"

      - name: Run the end-to-end suite
        run: just frontend _nvm "npx playwright test"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
